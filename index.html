  const activeOrders = (orders.data || []).filter(o => o.status !== 'completed').length;
  const completedOrders = (orders.data || []).filter(o => o.status === 'completed').length;

  body.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="num">${pendingApps}</div><div class="label">待处理申请</div></div>
      <div class="stat-card"><div class="num">${activeOrders}</div><div class="label">进行中订单</div></div>
      <div class="stat-card"><div class="num">${completedOrders}</div><div class="label">已完成订单</div></div>
      <div class="stat-card"><div class="num">${works.count || 0}</div><div class="label">作品数量</div></div>
    </div>`;
}

/* ── 后台：申请管理 ── */
let adminAppTab = 'pending';

async function loadAdminApps(body) {
  body.innerHTML = `<div class="app-tabs">
    <button class="app-tab ${adminAppTab==='pending'?'active':''}" onclick="adminAppTab='pending';loadAdminApps(document.getElementById('adminBody'))">待处理</button>
    <button class="app-tab ${adminAppTab==='accepted'?'active':''}" onclick="adminAppTab='accepted';loadAdminApps(document.getElementById('adminBody'))">已接单</button>
    <button class="app-tab ${adminAppTab==='rejected'?'active':''}" onclick="adminAppTab='rejected';loadAdminApps(document.getElementById('adminBody'))">已拒绝</button>
  </div>
  <div id="adminAppList" class="admin-list" style="margin-top:12px;"></div>`;

  const { data, error } = await sb.from('applications')
    .select('*')
    .eq('status', adminAppTab)
    .order('created_at', { ascending: false });

  if (error) return toast('加载失败', 'error');

  const list = document.getElementById('adminAppList');
  if (!data || !data.length) {
    list.innerHTML = '<p style="text-align:center;padding:40px;color:var(--c-text-light);">暂无数据</p>';
    return;
  }

  list.innerHTML = data.map(app => `
    <div class="admin-card">
      <div class="ac-title">${app.name} · ${app.contact}</div>
      <div class="ac-sub">${app.requirement || '未填写需求'}</div>
      <div class="ac-sub">预算: ${app.budget || '-'} | 期望: ${app.expected_time || '-'} ${app.is_rush ? '| 🔥 加急' : ''}</div>
      <div class="ac-sub">${fmtDate(app.created_at)}</div>
      ${app.design_images?.length ? `<div style="display:flex;gap:4px;margin-top:8px;flex-wrap:wrap;">
        ${app.design_images.map(u => `<img src="${u}" style="width:48px;height:48px;border-radius:6px;object-fit:cover;cursor:pointer;" onclick="previewImg('${u}')">`).join('')}
      </div>` : ''}
      ${adminAppTab === 'pending' ? `<div class="ac-actions">
        <button class="btn btn-sm btn-primary" onclick="acceptApp('${app.id}','${app.name}','${app.contact}',${app.is_rush})">接单</button>
        <button class="btn btn-sm btn-ghost" onclick="rejectApp('${app.id}')">拒绝</button>
      </div>` : ''}
      ${app.status === 'rejected' && app.reject_reason ? `<div style="color:var(--c-danger);font-size:12px;margin-top:8px;">拒绝原因: ${app.reject_reason}</div>` : ''}
    </div>
  `).join('');
}

/** 接单 */
function acceptApp(appId, name, contact, isRush) {
  const body = document.getElementById('commonModalBody');
  const curMonth = getCurrentMonth();
  body.innerHTML = `<h3>接单确认</h3>
    <div class="form-group"><label>项目名称</label><input id="accProject" type="text" placeholder="如：汉服·对襟褙子"></div>
    <div class="form-group"><label>排单月份</label><input id="accMonth" type="month" value="${curMonth}"></div>
    <div class="form-group"><label>预估完成</label><input id="accEstimate" type="text" placeholder="如：12月上旬"></div>
    <button class="btn btn-primary btn-block" onclick="doAcceptApp('${appId}','${name}','${contact}',${isRush})">确认建单</button>`;
  document.getElementById('commonModal').classList.add('active');
}

async function doAcceptApp(appId, name, contact, isRush) {
  const project = document.getElementById('accProject').value.trim() || '定制项目';
  const month = document.getElementById('accMonth').value;
  const estimate = document.getElementById('accEstimate').value.trim();

  // 查找对应用户
  const { data: app } = await sb.from('applications').select('user_id').eq('id', appId).single();

  const { data, error } = await sb.rpc('create_order_with_nodes', {
    p_user_id: app?.user_id || null,
    p_application_id: appId,
    p_project_name: project,
    p_customer_name: name,
    p_customer_contact: contact,
    p_is_rush: isRush,
    p_schedule_month: month,
    p_estimated_time: estimate
  });

  if (error) {
    toast('建单失败: ' + error.message, 'error');
    return;
  }

  toast(`订单已创建：${data.order_no}`, 'success');
  closeCommonModal();
  loadAdminApps(document.getElementById('adminBody'));
}

function rejectApp(appId) {
  const reason = prompt('请输入拒绝原因（可选）：');
  if (reason === null) return; // 取消
  sb.from('applications')
    .update({ status: 'rejected', reject_reason: reason })
    .eq('id', appId)
    .then(({ error }) => {
      if (error) toast('操作失败', 'error');
      else {
        toast('已拒绝', 'info');
        loadAdminApps(document.getElementById('adminBody'));
      }
    });
}

/* ── 后台：订单管理 ── */
async function loadAdminOrders(body) {
  body.innerHTML = `<div class="admin-search"><input id="orderSearch" type="text" placeholder="搜索订单号/客户名/项目名" oninput="searchAdminOrders()"></div>
    <div style="padding:0 16px 12px;">
      <button class="btn btn-sm btn-primary" onclick="openManualOrder()">+ 手动建单</button>
    </div>
    <div id="adminOrderList" class="admin-list"></div>`;

  searchAdminOrders();
}

async function searchAdminOrders() {
  const q = (document.getElementById('orderSearch')?.value || '').trim().toLowerCase();
  const { data, error } = await sb.from('orders')
    .select('*')
    .order('created_at', { ascending: false });

  if (error) return toast('加载失败', 'error');

  const filtered = q ? (data || []).filter(o =>
    o.order_no.toLowerCase().includes(q) ||
    o.customer_name.toLowerCase().includes(q) ||
    o.project_name.toLowerCase().includes(q)
  ) : (data || []);

  const list = document.getElementById('adminOrderList');
  if (!filtered.length) {
    list.innerHTML = '<p style="text-align:center;padding:40px;color:var(--c-text-light);">无结果</p>';
    return;
  }

  list.innerHTML = filtered.map(o => `
    <div class="admin-card">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div class="ac-title">${o.order_no}</div>
        <span class="oc-status ${o.status}">${statusText(o.status)}</span>
      </div>
      <div class="ac-sub">${o.customer_name} · ${o.project_name}</div>
      <div class="ac-sub">${fmtMonth(o.schedule_month)} | ${o.estimated_time || '待定'} ${o.is_rush ? '| 🔥 加急' : ''}</div>
      <div class="ac-actions">
        <button class="btn btn-sm btn-secondary" onclick="openAdminOrderDetail('${o.id}')">管理</button>
        <button class="btn btn-sm btn-ghost" onclick="copyShareLink('${o.share_token}')">分享链接</button>
      </div>
    </div>
  `).join('');
}

function copyShareLink(token) {
  const url = `${location.origin}${location.pathname}?token=${token}`;
  navigator.clipboard.writeText(url).then(() => toast('链接已复制', 'success'))
    .catch(() => {
      prompt('复制此链接：', url);
    });
}

/** 手动建单 */
function openManualOrder() {
  const body = document.getElementById('commonModalBody');
  body.innerHTML = `<h3>手动建单</h3>
    <div class="form-group"><label>客户名 <span class="required">*</span></label><input id="moName" type="text"></div>
    <div class="form-group"><label>联系方式</label><input id="moContact" type="text"></div>
    <div class="form-group"><label>项目名称 <span class="required">*</span></label><input id="moProject" type="text"></div>
    <div class="form-group"><label>排单月份</label><input id="moMonth" type="month" value="${getCurrentMonth()}"></div>
    <div class="form-group"><label>预估完成</label><input id="moEstimate" type="text"></div>
    <div class="switch-row"><label>加急</label><div id="moRush" class="toggle" onclick="this.classList.toggle('on')"></div></div>
    <button class="btn btn-primary btn-block" style="margin-top:16px;" onclick="doManualOrder()">创建订单</button>`;
  document.getElementById('commonModal').classList.add('active');
}

async function doManualOrder() {
  const name = document.getElementById('moName').value.trim();
  const project = document.getElementById('moProject').value.trim();
  if (!name || !project) return toast('客户名和项目名必填', 'error');

  const { data, error } = await sb.rpc('create_order_with_nodes', {
    p_user_id: null,
    p_application_id: null,
    p_project_name: project,
    p_customer_name: name,
    p_customer_contact: document.getElementById('moContact').value.trim(),
    p_is_rush: document.getElementById('moRush').classList.contains('on'),
    p_schedule_month: document.getElementById('moMonth').value,
    p_estimated_time: document.getElementById('moEstimate').value.trim()
  });

  if (error) return toast('创建失败: ' + error.message, 'error');
  toast(`订单 ${data.order_no} 已创建`, 'success');
  closeCommonModal();

  // 显示分享链接
  copyShareLink(data.share_token);
  searchAdminOrders();
}

/** 管理员订单详情 */
async function openAdminOrderDetail(orderId) {
  const body = document.getElementById('commonModalBody');
  body.innerHTML = '<div class="skeleton skeleton-card"></div>';
  document.getElementById('commonModal').classList.add('active');

  const [oRes, nRes, mRes, rlRes] = await Promise.all([
    sb.from('orders').select('*').eq('id', orderId).single(),
    sb.from('order_nodes').select('*').eq('order_id', orderId).order('sort_order'),
    sb.from('materials').select('*').eq('order_id', orderId).order('created_at'),
    sb.from('remark_logs').select('*').eq('order_id', orderId).order('created_at', { ascending: false })
  ]);

  const order = oRes.data;
  const nodes = nRes.data || [];
  const mats = mRes.data || [];
  const remarkLogs = rlRes.data || [];

  let html = `<h3>管理 ${order.order_no}</h3>`;

  // 基本信息编辑
  html += `<div class="card">
    <div class="form-group"><label>状态</label>
      <select id="adOrdStatus" onchange="updateOrderField('${orderId}','status',this.value)">
        <option value="queued" ${order.status==='queued'?'selected':''}>排队中</option>
        <option value="in_progress" ${order.status==='in_progress'?'selected':''}>制作中</option>
        <option value="completed" ${order.status==='completed'?'selected':''}>已完成</option>
      </select>
    </div>
    <div class="form-group"><label>排单月份</label>
      <input type="month" value="${order.schedule_month}" onchange="updateOrderField('${orderId}','schedule_month',this.value)">
    </div>
    <div class="form-group"><label>预估完成</label>
      <input type="text" value="${order.estimated_time || ''}" onchange="updateOrderField('${orderId}','estimated_time',this.value)">
    </div>
    <div class="switch-row"><label>加急</label>
      <div class="toggle ${order.is_rush?'on':''}" onclick="this.classList.toggle('on');updateOrderField('${orderId}','is_rush',this.classList.contains('on'))"></div>
    </div>
  </div>`;

  // 节点管理
  html += `<div class="card">
    <h3 style="font-size:15px;margin-bottom:12px;">节点管理</h3>`;
  nodes.forEach(n => {
    html += `<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:8px;background:var(--c-bg);border-radius:8px;">
      <span style="flex:1;font-size:14px;${n.status==='skipped'?'text-decoration:line-through;color:var(--c-gray-purple);':''}">${n.node_name}</span>
      <select style="width:auto;font-size:12px;padding:4px 8px;" onchange="updateNodeStatus('${orderId}','${n.id}',this.value)">
        <option value="pending" ${n.status==='pending'?'selected':''}>待处理</option>
        <option value="completed" ${n.status==='completed'?'selected':''}>已完成</option>
        <option value="skipped" ${n.status==='skipped'?'selected':''}>跳过</option>
      </select>
      <button class="btn btn-sm btn-ghost" style="padding:4px 8px;font-size:11px;" onclick="uploadNodePhoto('${orderId}','${n.id}')">📷</button>
      <button class="btn btn-sm btn-ghost" style="padding:4px 8px;font-size:11px;color:var(--c-danger);" onclick="deleteNode('${orderId}','${n.id}')">✕</button>
    </div>`;
  });
  html += `<div style="display:flex;gap:8px;margin-top:8px;">
    <input id="newNodeName" type="text" placeholder="新节点名" style="flex:1;">
    <button class="btn btn-sm btn-secondary" onclick="addNode('${orderId}')">添加</button>
  </div></div>`;

  // 材料管理
  html += `<div class="card">
    <h3 style="font-size:15px;margin-bottom:12px;">材料管理</h3>`;
  mats.forEach(m => {
    html += `<div style="padding:8px;background:var(--c-bg);border-radius:8px;margin-bottom:8px;font-size:13px;">
      <div style="font-weight:600;">${m.name} ${m.specification ? '(' + m.specification + ')' : ''}</div>
      <div>${m.quantity}${m.unit} × ¥${m.unit_price}</div>
      <div style="display:flex;gap:8px;margin-top:4px;">
        <select style="width:auto;font-size:12px;padding:4px;" onchange="updateMaterial('${m.id}','status',this.value)">
          <option value="pending" ${m.status==='pending'?'selected':''}>待采购</option>
          <option value="ordered" ${m.status==='ordered'?'selected':''}>已下单</option>
          <option value="arrived" ${m.status==='arrived'?'selected':''}>已到货</option>
        </select>
        <button class="btn btn-sm btn-ghost" style="padding:2px 8px;font-size:11px;color:var(--c-danger);" onclick="deleteMaterial('${orderId}','${m.id}')">删除</button>
      </div>
    </div>`;
  });
  html += `<button class="btn btn-sm btn-secondary" onclick="openAddMaterial('${orderId}')">+ 添加材料</button></div>`;

  // 备注变更记录
  if (remarkLogs.length) {
    html += `<div class="card">
      <h3 style="font-size:15px;margin-bottom:12px;">备注变更记录</h3>`;
    remarkLogs.forEach(log => {
      html += `<div style="padding:8px;background:var(--c-bg);border-radius:8px;margin-bottom:8px;font-size:13px;">
        <div style="color:var(--c-text-light);">${fmtDate(log.created_at)}</div>
        <div>"${log.old_remark || '(空)'}" → "${log.new_remark || '(空)'}"</div>
        ${!log.acknowledged ? `<button class="btn btn-sm btn-ghost" style="margin-top:4px;padding:2px 10px;font-size:11px;" onclick="ackRemarkLog('${orderId}','${log.id}')">标记已知晓</button>` : '<span style="color:var(--c-success);font-size:11px;">✓ 已知晓</span>'}
      </div>`;
    });
    html += '</div>';
  }

  // 发通知
  html += `<div class="card">
    <h3 style="font-size:15px;margin-bottom:12px;">发送通知/留言</h3>
    <div class="form-group"><textarea id="adminMsg" placeholder="输入内容…"></textarea></div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-sm btn-primary" onclick="adminSendMsg('${orderId}',false)">发送留言</button>
      <button class="btn btn-sm btn-secondary" onclick="adminSendMsg('${orderId}',true)">发通知</button>
    </div>
  </div>`;

  body.innerHTML = html;
}

async function updateOrderField(orderId, field, value) {
  const update = {};
  update[field] = value;
  const { error } = await sb.from('orders').update(update).eq('id', orderId);
  if (error) toast('更新失败: ' + error.message, 'error');
  else toast('已更新', 'success');
}

async function updateNodeStatus(orderId, nodeId, status) {
  const update = { status };
  if (status === 'completed') update.completed_at = new Date().toISOString();
  else update.completed_at = null;

  const { error } = await sb.from('order_nodes').update(update).eq('id', nodeId);
  if (error) toast('更新失败: ' + error.message, 'error');
  else {
    toast('节点已更新', 'success');
    // 刷新详情
    openAdminOrderDetail(orderId);
  }
}

function uploadNodePhoto(orderId, nodeId) {
  const input = document.getElementById('fileInput');
  input.value = '';
  input.multiple = true;
  fileInputCallback = async (files) => {
    for (const file of files) {
      const url = await uploadImage('order-images', file);
      if (url) {
        await sb.from('node_photos').insert({ node_id: nodeId, image_url: url });
      }
    }
    toast('照片已上传', 'success');
    openAdminOrderDetail(orderId);
  };
  input.click();
}

async function deleteNode(orderId, nodeId) {
  if (!confirm('确定删除此节点？')) return;
  const { error } = await sb.from('order_nodes').delete().eq('id', nodeId);
  if (error) toast('删除失败', 'error');
  else openAdminOrderDetail(orderId);
}

async function addNode(orderId) {
  const name = document.getElementById('newNodeName').value.trim();
  if (!name) return toast('请输入节点名', 'error');

  // 获取最大 sort_order
  const { data: nodes } = await sb.from('order_nodes')
    .select('sort_order')
    .eq('order_id', orderId)
    .order('sort_order', { ascending: false })
    .limit(1);
  const maxSort = nodes?.length ? nodes[0].sort_order + 1 : 1;

  const { error } = await sb.from('order_nodes').insert({
    order_id: orderId,
    node_name: name,
    sort_order: maxSort
  });
  if (error) toast('添加失败', 'error');
  else openAdminOrderDetail(orderId);
}

async function updateMaterial(matId, field, value) {
  const update = {};
  update[field] = value;
  const { error } = await sb.from('materials').update(update).eq('id', matId);
  if (error) toast('更新失败', 'error');
  else toast('已更新', 'success');
}

async function deleteMaterial(orderId, matId) {
  if (!confirm('确定删除？')) return;
  const { error } = await sb.from('materials').delete().eq('id', matId);
  if (error) toast('删除失败', 'error');
  else openAdminOrderDetail(orderId);
}

function openAddMaterial(orderId) {
  const existing = document.getElementById('commonModalBody');
  // 在当前模态中添加一个内联表单
  const formHtml = `<div id="addMatForm" class="card" style="margin-top:12px;border:2px solid var(--c-primary);">
    <h4 style="font-size:14px;margin-bottom:8px;">添加材料</h4>
    <div class="form-group"><label>名称</label><input id="matName" type="text"></div>
    <div class="form-group"><label>规格</label><input id="matSpec" type="text"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">
      <div class="form-group"><label>数量</label><input id="matQty" type="number" step="0.1"></div>
      <div class="form-group"><label>单位</label><input id="matUnit" type="text" placeholder="米/个"></div>
      <div class="form-group"><label>单价</label><input id="matPrice" type="number" step="0.01"></div>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-sm btn-primary" onclick="doAddMaterial('${orderId}')">添加</button>
      <button class="btn btn-sm btn-ghost" onclick="document.getElementById('addMatForm').remove()">取消</button>
    </div>
  </div>`;

  // 移除旧表单
  const old = document.getElementById('addMatForm');
  if (old) old.remove();

  existing.insertAdjacentHTML('beforeend', formHtml);
}

async function doAddMaterial(orderId) {
  const name = document.getElementById('matName').value.trim();
  if (!name) return toast('材料名必填', 'error');

  const { error } = await sb.from('materials').insert({
    order_id: orderId,
    name,
    specification: document.getElementById('matSpec').value.trim(),
    quantity: parseFloat(document.getElementById('matQty').value) || 0,
    unit: document.getElementById('matUnit').value.trim(),
    unit_price: parseFloat(document.getElementById('matPrice').value) || 0
  });

  if (error) toast('添加失败', 'error');
  else openAdminOrderDetail(orderId);
}

async function ackRemarkLog(orderId, logId) {
  const { error } = await sb.from('remark_logs').update({ acknowledged: true }).eq('id', logId);
  if (error) toast('操作失败', 'error');
  else openAdminOrderDetail(orderId);
}

async function adminSendMsg(orderId, isNotification) {
  const content = document.getElementById('adminMsg').value.trim();
  if (!content) return toast('请输入内容', 'error');
  const { error } = await sb.from('messages').insert({
    order_id: orderId,
    user_id: currentUser.id,
    content,
    is_notification: isNotification
  });
  if (error) toast('发送失败', 'error');
  else {
    toast('已发送', 'success');
    document.getElementById('adminMsg').value = '';
  }
}

/* ── 后台：排单管理 ── */
async function loadAdminQueue(body) {
  body.innerHTML = '<div class="page-content"><div class="skeleton skeleton-card"></div></div>';

  const [ordersRes, msRes] = await Promise.all([
    sb.from('orders').select('*').order('schedule_month').order('sort_order'),
    sb.from('month_settings').select('*').order('month')
  ]);

  const orders = ordersRes.data || [];
  const settings = msRes.data || [];

  let html = `<div class="page-content">
    <h3 style="font-size:16px;margin-bottom:12px;">月份容量设置</h3>`;

  // 月份容量设置
  const months = [...new Set([...orders.map(o => o.schedule_month), ...settings.map(s => s.month)])].filter(Boolean).sort();
  if (!months.length) months.push(getCurrentMonth());

  months.forEach(m => {
    const ms = settings.find(s => s.month === m) || { normal_limit: 8, rush_limit: 2, id: null };
    html += `<div class="card" style="padding:12px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <strong>${fmtMonth(m)}</strong>
        <div style="display:flex;gap:8px;font-size:13px;">
          <span>普通上限: <input type="number" value="${ms.normal_limit}" style="width:50px;padding:4px;font-size:13px;" onchange="updateMonthSetting('${m}','${ms.id}','normal_limit',this.value)"></span>
          <span>加塞上限: <input type="number" value="${ms.rush_limit}" style="width:50px;padding:4px;font-size:13px;" onchange="updateMonthSetting('${m}','${ms.id}','rush_limit',this.value)"></span>
        </div>
      </div>
    </div>`;
  });

  html += `<div style="margin-bottom:16px;">
    <button class="btn btn-sm btn-secondary" onclick="addMonthSetting()">+ 添加月份</button>
  </div>`;

  // 按月分组的排单列表
  const groups = {};
  orders.forEach(o => {
    const m = o.schedule_month || '未排期';
    if (!groups[m]) groups[m] = [];
    groups[m].push(o);
  });

  Object.keys(groups).sort().forEach(m => {
    html += `<h3 style="font-size:15px;margin:16px 0 8px;">${fmtMonth(m)}</h3>`;
    groups[m].forEach((o, i) => {
      html += `<div class="admin-card" style="display:flex;align-items:center;gap:12px;">
        <div style="display:flex;flex-direction:column;gap:2px;">
          <button class="btn btn-sm btn-ghost" style="padding:2px 6px;font-size:10px;" onclick="moveQueueOrder('${o.id}',${o.sort_order - 1})">↑</button>
          <button class="btn btn-sm btn-ghost" style="padding:2px 6px;font-size:10px;" onclick="moveQueueOrder('${o.id}',${o.sort_order + 1})">↓</button>
        </div>
        <div style="flex:1;">
          <div style="font-weight:600;font-size:14px;">${o.order_no} · ${o.customer_name}</div>
          <div style="font-size:12px;color:var(--c-text-light);">${o.project_name} ${o.is_rush ? '🔥' : ''} | ${statusText(o.status)} | 预估: ${o.estimated_time || '-'}</div>
        </div>
        <select style="width:auto;font-size:12px;padding:4px;" onchange="updateOrderField('${o.id}','status',this.value);loadAdminQueue(document.getElementById('adminBody'))">
          <option value="queued" ${o.status==='queued'?'selected':''}>排队中</option>
          <option value="in_progress" ${o.status==='in_progress'?'selected':''}>制作中</option>
          <option value="completed" ${o.status==='completed'?'selected':''}>已完成</option>
        </select>
      </div>`;
    });
  });

  html += '</div>';
  body.innerHTML = html;
}

async function updateMonthSetting(month, existingId, field, value) {
  if (existingId && existingId !== 'null') {
    const update = {};
    update[field] = parseInt(value);
    const { error } = await sb.from('month_settings').update(update).eq('id', existingId);
    if (error) toast('更新失败', 'error');
    else toast('已更新', 'success');
  } else {
    const row = { month };
    row[field] = parseInt(value);
    const { error } = await sb.from('month_settings').upsert(row, { onConflict: 'month' });
    if (error) toast('保存失败', 'error');
    else toast('已保存', 'success');
  }
}

function addMonthSetting() {
  const month = prompt('输入月份（格式 YYYY-MM）：', getCurrentMonth());
  if (!month) return;
  sb.from('month_settings').upsert({ month, normal_limit: 8, rush_limit: 2 }, { onConflict: 'month' })
    .then(({ error }) => {
      if (error) toast('添加失败', 'error');
      else loadAdminQueue(document.getElementById('adminBody'));
    });
}

async function moveQueueOrder(orderId, newSort) {
  const { error } = await sb.from('orders').update({ sort_order: newSort }).eq('id', orderId);
  if (error) toast('移动失败', 'error');
  else loadAdminQueue(document.getElementById('adminBody'));
}

/* ── 后台：作品管理 ── */
async function loadAdminWorks(body) {
  const { data, error } = await sb.from('works')
    .select('*, categories(name)')
    .order('is_pinned', { ascending: false })
    .order('sort_order')
    .order('created_at', { ascending: false });

  if (error) return toast('加载失败', 'error');

  let html = `<div style="padding:12px 16px;">
    <button class="btn btn-sm btn-primary" onclick="openAddWork()">+ 添加作品</button>
    <button class="btn btn-sm btn-secondary" onclick="openGenWork()">从已完成订单生成</button>
  </div>
  <div class="admin-list">`;

  (data || []).forEach(w => {
    html += `<div class="admin-card" style="display:flex;gap:12px;">
      <img src="${w.cover_image}" style="width:60px;height:80px;border-radius:8px;object-fit:cover;"
           onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 3 4%22><rect fill=%22%23ECD9ED%22 width=%223%22 height=%224%22/></svg>'">
      <div style="flex:1;">
        <div class="ac-title">${w.is_pinned ? '📌 ' : ''}${w.is_hidden ? '👁‍🗨 ' : ''}${w.title}</div>
        <div class="ac-sub">${w.categories?.name || '未分类'}</div>
        <div class="ac-actions">
          <button class="btn btn-sm btn-ghost" onclick="toggleWorkPin('${w.id}',${!w.is_pinned})">${w.is_pinned ? '取消置顶' : '置顶'}</button>
          <button class="btn btn-sm btn-ghost" onclick="toggleWorkHide('${w.id}',${!w.is_hidden})">${w.is_hidden ? '显示' : '隐藏'}</button>
          <button class="btn btn-sm btn-ghost" onclick="editWork('${w.id}')">编辑</button>
          <button class="btn btn-sm btn-ghost" style="color:var(--c-danger);" onclick="deleteWork('${w.id}')">删除</button>
        </div>
      </div>
    </div>`;
  });

  html += '</div>';
  body.innerHTML = html;
}

function openAddWork() {
  const body = document.getElementById('commonModalBody');
  body.innerHTML = `<h3>添加作品</h3>
    <div class="form-group"><label>标题 <span class="required">*</span></label><input id="wkTitle" type="text"></div>
    <div class="form-group"><label>分类</label>
      <select id="wkCat">
        <option value="">未分类</option>
        ${categoriesData.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
      </select>
    </div>
    <div class="form-group"><label>描述</label><textarea id="wkDesc"></textarea></div>
    <div class="form-group"><label>封面图</label>
      <div id="wkCoverPreview" style="margin-bottom:8px;"></div>
      <button class="btn btn-sm btn-secondary" onclick="pickWorkCover()">选择封面</button>
    </div>
    <button class="btn btn-primary btn-block" style="margin-top:16px;" onclick="doAddWork()">保存</button>`;
  document.getElementById('commonModal').classList.add('active');
}

let workCoverUrl = '';

function pickWorkCover() {
  const input = document.getElementById('fileInput');
  input.value = '';
  input.multiple = false;
  fileInputCallback = async (files) => {
    const url = await uploadImage('work-images', files[0]);
    if (url) {
      workCoverUrl = url;
      document.getElementById('wkCoverPreview').innerHTML =
        `<img src="${url}" style="width:100px;height:133px;border-radius:8px;object-fit:cover;">`;
    }
  };
  input.click();
}

async function doAddWork() {
  const title = document.getElementById('wkTitle').value.trim();
  if (!title) return toast('标题必填', 'error');

  const { error } = await sb.from('works').insert({
    title,
    category_id: document.getElementById('wkCat').value || null,
    description: document.getElementById('wkDesc').value,
    cover_image: workCoverUrl
  });

  if (error) return toast('添加失败: ' + error.message, 'error');
  toast('作品已添加', 'success');
  workCoverUrl = '';
  closeCommonModal();
  loadAdminWorks(document.getElementById('adminBody'));
}

function openGenWork() {
  const body = document.getElementById('commonModalBody');
  body.innerHTML = `<h3>从已完成订单生成作品</h3><div id="genWorkList">加载中…</div>`;
  document.getElementById('commonModal').classList.add('active');

  sb.from('orders').select('*').eq('status', 'completed').order('updated_at', { ascending: false })
    .then(({ data }) => {
      const list = document.getElementById('genWorkList');
      if (!data?.length) {
        list.innerHTML = '<p style="color:var(--c-text-light);">暂无已完成订单</p>';
        return;
      }
      list.innerHTML = data.map(o => `
        <div class="admin-card">
          <div class="ac-title">${o.order_no} · ${o.project_name}</div>
          <button class="btn btn-sm btn-secondary" onclick="genWorkFromOrder('${o.id}','${o.project_name.replace(/'/g, "\\'")}')">生成作品</button>
        </div>
      `).join('');
    });
}

async function genWorkFromOrder(orderId, projectName) {
  const { error } = await sb.from('works').insert({
    title: projectName,
    order_id: orderId,
    cover_image: ''
  });
  if (error) return toast('生成失败', 'error');
  toast('作品已生成，请编辑完善', 'success');
  closeCommonModal();
  loadAdminWorks(document.getElementById('adminBody'));
}

async function toggleWorkPin(id, pinned) {
  const { error } = await sb.from('works').update({ is_pinned: pinned }).eq('id', id);
  if (error) toast('操作失败', 'error');
  else loadAdminWorks(document.getElementById('adminBody'));
}

async function toggleWorkHide(id, hidden) {
  const { error } = await sb.from('works').update({ is_hidden: hidden }).eq('id', id);
  if (error) toast('操作失败', 'error');
  else loadAdminWorks(document.getElementById('adminBody'));
}

async function editWork(id) {
  const { data: work } = await sb.from('works').select('*').eq('id', id).single();
  if (!work) return;

  const body = document.getElementById('commonModalBody');
  workCoverUrl = work.cover_image;
  body.innerHTML = `<h3>编辑作品</h3>
    <div class="form-group"><label>标题</label><input id="wkTitle" type="text" value="${work.title}"></div>
    <div class="form-group"><label>分类</label>
      <select id="wkCat">
        <option value="">未分类</option>
        ${categoriesData.map(c => `<option value="${c.id}" ${c.id===work.category_id?'selected':''}>${c.name}</option>`).join('')}
      </select>
    </div>
    <div class="form-group"><label>描述</label><textarea id="wkDesc">${work.description || ''}</textarea></div>
    <div class="form-group"><label>封面图</label>
      <div id="wkCoverPreview">${work.cover_image ? `<img src="${work.cover_image}" style="width:100px;height:133px;border-radius:8px;object-fit:cover;">` : ''}</div>
      <button class="btn btn-sm btn-secondary" style="margin-top:8px;" onclick="pickWorkCover()">更换封面</button>
    </div>
    <div class="form-group"><label>排序值</label><input id="wkSort" type="number" value="${work.sort_order}"></div>
    <button class="btn btn-primary btn-block" style="margin-top:16px;" onclick="doEditWork('${id}')">保存</button>`;
  document.getElementById('commonModal').classList.add('active');
}

async function doEditWork(id) {
  const { error } = await sb.from('works').update({
    title: document.getElementById('wkTitle').value.trim(),
    category_id: document.getElementById('wkCat').value || null,
    description: document.getElementById('wkDesc').value,
    cover_image: workCoverUrl,
    sort_order: parseInt(document.getElementById('wkSort').value) || 0
  }).eq('id', id);

  if (error) return toast('保存失败', 'error');
  toast('已保存', 'success');
  workCoverUrl = '';
  closeCommonModal();
  loadAdminWorks(document.getElementById('adminBody'));
}

async function deleteWork(id) {
  if (!confirm('确定删除此作品？')) return;
  const { error } = await sb.from('works').delete().eq('id', id);
  if (error) toast('删除失败', 'error');
  else loadAdminWorks(document.getElementById('adminBody'));
}

/* ═══════════════════════════════════════════
   11. 分享令牌访问
   ═══════════════════════════════════════════ */
async function handleShareToken() {
  const params = new URLSearchParams(location.search);
  const token = params.get('token');
  if (!token) return false;

  const { data, error } = await sb.rpc('get_order_by_token', { p_token: token });
  if (error || !data || !data.order) {
    toast('分享链接无效或已过期', 'error');
    return false;
  }

  // 直接显示订单详情
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-orderDetail').classList.add('active');
  hide('tabBar');

  const order = data.order;
  const nodes = data.nodes || [];
  const mats = data.materials || [];

  document.getElementById('odTitle').textContent = order.project_name;

  let html = `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <span class="oc-status ${order.status}">${statusText(order.status)}</span>
      <span style="font-size:13px;color:var(--c-text-light);">${order.order_no}</span>
    </div>
    <div style="margin-top:8px;font-size:14px;">
      <div>客户：${maskName(order.customer_name)}</div>
      <div>排单月份：${fmtMonth(order.schedule_month)}</div>
      <div>预估完成：${order.estimated_time || '待定'}</div>
    </div>
  </div>`;

  // 时间线
  html += `<div class="card" style="padding-bottom:0;">
    <h3 style="font-size:15px;margin-bottom:16px;">📋 制作进度</h3>
    <div class="timeline">`;

  let currentFound = false;
  nodes.forEach((n, i) => {
    const isDone = n.status === 'completed';
    const isSkip = n.status === 'skipped';
    let cls = '';
    if (isDone) cls = 'done';
    else if (isSkip) cls = 'skipped';
    else if (!currentFound) { cls = 'current'; currentFound = true; }
    const isLast = i === nodes.length - 1;

    html += `<div class="timeline-node ${cls}">
      <div class="timeline-line">
        <div class="timeline-dot">${isDone ? '✓' : isSkip ? '—' : ''}</div>
        ${!isLast ? '<div class="timeline-connector"></div>' : ''}
      </div>
      <div class="tl-content">
        <div class="tl-name">${n.node_name}</div>
        ${isDone ? `<div class="tl-time">${fmtDate(n.completed_at)}</div>` : ''}
      </div>
    </div>`;
  });
  html += '</div></div>';

  // 材料清单
  if (mats.length) {
    let total = 0;
    html += `<div class="card"><h3 style="font-size:15px;margin-bottom:12px;">🧵 材料清单</h3>`;
    mats.forEach(m => {
      const sub = (m.quantity || 0) * (m.unit_price || 0);
      total += sub;
      html += `<div class="material-card">
        <div class="mc-name">${m.name}</div>
        <div class="mc-row"><span>${m.quantity}${m.unit} × ¥${m.unit_price}</span><span>${matStatusText(m.status)}</span></div>
      </div>`;
    });
    html += `<div class="material-total">合计：¥${total.toFixed(2)}</div></div>`;
  }

  document.getElementById('orderDetailContent').innerHTML = html;
  return true;
}

/* ═══════════════════════════════════════════
   12. 应用初始化
   ═══════════════════════════════════════════ */
async function initApp() {
  // 监听认证状态
  sb.auth.onAuthStateChange(async (event, session) => {
    if (session?.user) {
      currentUser = session.user;
      await loadUserProfile();
    } else {
      currentUser = null;
      currentProfile = null;
    }
  });

  // 初始加载用户
  await loadUserProfile();

  // 处理分享令牌
  const hasToken = await handleShareToken();
  if (!hasToken) {
    // 正常路由
    handleRoute();
  }
}

// 启动
initApp();
</script>
</body>
</html>
