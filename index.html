<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#746097">
<title>定制工坊管家</title>
<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
/* ═══════════════════════════════════════════
   CSS 变量 & 全局重置
   ═══════════════════════════════════════════ */
:root {
  --c-primary: #746097;
  --c-secondary: #AD86AE;
  --c-light-purple: #ECD9ED;
  --c-beige: #EADACB;
  --c-bg: #FBF8FB;
  --c-gray-purple: #B5B0BA;
  --c-white: #FFFFFF;
  --c-text: #3A3040;
  --c-text-light: #8A8490;
  --c-danger: #D4736A;
  --c-success: #6AAD7D;
  --radius: 12px;
  --shadow: 0 2px 12px rgba(116,96,151,0.10);
  --shadow-lg: 0 4px 24px rgba(116,96,151,0.16);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --tab-height: 60px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC",
    "Helvetica Neue", sans-serif;
  background: var(--c-bg);
  color: var(--c-text);
  line-height: 1.6;
  overflow-x: hidden;
  padding-bottom: calc(var(--tab-height) + var(--safe-bottom) + 8px);
}
a { color: var(--c-primary); text-decoration: none; }
button {
  border: none; outline: none; cursor: pointer;
  font-family: inherit; font-size: inherit;
}
input, textarea, select {
  font-family: inherit; font-size: 15px;
  border: 1.5px solid var(--c-light-purple);
  border-radius: var(--radius);
  padding: 10px 14px;
  background: var(--c-white);
  color: var(--c-text);
  width: 100%;
  transition: border-color .2s;
}
input:focus, textarea:focus, select:focus {
  border-color: var(--c-primary);
  outline: none;
}
textarea { resize: vertical; min-height: 80px; }
img { display: block; max-width: 100%; }

/* ═══════════════════════════════════════════
   通用组件
   ═══════════════════════════════════════════ */

/* 按钮 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 24px; border-radius: 24px;
  font-size: 15px; font-weight: 500;
  transition: all .2s;
}
.btn-primary {
  background: var(--c-primary); color: #fff;
}
.btn-primary:active { background: #5e4e7f; }
.btn-secondary {
  background: var(--c-light-purple); color: var(--c-primary);
}
.btn-secondary:active { background: #dcc6dd; }
.btn-ghost {
  background: transparent; color: var(--c-primary);
  border: 1.5px solid var(--c-light-purple);
}
.btn-block { width: 100%; }
.btn-sm { padding: 6px 16px; font-size: 13px; }
.btn:disabled { opacity: .5; pointer-events: none; }

/* Toast */
.toast-wrap {
  position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
  z-index: 9999; display: flex; flex-direction: column; gap: 8px;
  pointer-events: none; width: 90%; max-width: 360px;
}
.toast {
  padding: 12px 20px; border-radius: var(--radius);
  background: var(--c-white); color: var(--c-text);
  box-shadow: var(--shadow-lg);
  font-size: 14px;
  animation: toastIn .3s ease, toastOut .3s ease 2.7s forwards;
  pointer-events: auto;
  display: flex; align-items: center; gap: 8px;
}
.toast.error { border-left: 4px solid var(--c-danger); }
.toast.success { border-left: 4px solid var(--c-success); }
.toast.info { border-left: 4px solid var(--c-primary); }
@keyframes toastIn { from { opacity:0; transform:translateY(-20px); } to { opacity:1; transform:translateY(0); } }
@keyframes toastOut { from { opacity:1; } to { opacity:0; transform:translateY(-20px); } }

/* 骨架屏 */
.skeleton {
  background: linear-gradient(90deg, #f0e8f0 25%, #f8f0f8 50%, #f0e8f0 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  border-radius: var(--radius);
}
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
.skeleton-text { height: 14px; margin-bottom: 8px; border-radius: 7px; }
.skeleton-card { height: 180px; margin-bottom: 12px; }

/* 页面头部 */
.page-header {
  position: sticky; top: 0; z-index: 100;
  background: var(--c-white);
  padding: 12px 16px;
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid var(--c-light-purple);
}
.page-header h2 { flex: 1; font-size: 17px; font-weight: 600; }
.page-header .back-btn {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--c-light-purple);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; color: var(--c-primary);
}

/* 页面容器 */
.page { display: none; min-height: 100vh; padding-bottom: 20px; }
.page.active { display: block; }
.page-content { padding: 16px; }

/* 卡片 */
.card {
  background: var(--c-white);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
  margin-bottom: 12px;
}

/* 底部标签栏 */
.tab-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--c-light-purple);
  display: flex; justify-content: space-around; align-items: center;
  height: var(--tab-height);
  padding-bottom: var(--safe-bottom);
  z-index: 200;
  border-top: 1px solid rgba(116,96,151,0.08);
}
.tab-item {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  gap: 2px; padding: 6px 0; position: relative;
  color: var(--c-gray-purple); font-size: 11px; font-weight: 500;
  transition: color .2s;
  background: transparent;
}
.tab-item .tab-icon { font-size: 22px; transition: transform .2s; }
.tab-item.active {
  color: var(--c-primary);
}
.tab-item.active .tab-icon { transform: scale(1.1); }
.tab-item.active::before {
  content: '';
  position: absolute; top: 2px; left: 50%; transform: translateX(-50%);
  width: 48px; height: 28px;
  background: rgba(116,96,151,0.12);
  border-radius: 14px;
}
.tab-item .badge {
  position: absolute; top: 0; right: 50%; transform: translateX(18px);
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--c-danger);
}

/* 模态框 */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(58,48,64,0.5);
  z-index: 500; display: none; align-items: flex-end; justify-content: center;
}
.modal-overlay.active { display: flex; }
.modal-sheet {
  background: var(--c-white);
  border-radius: 20px 20px 0 0;
  width: 100%; max-width: 500px;
  max-height: 90vh; overflow-y: auto;
  padding: 24px 20px;
  padding-bottom: calc(24px + var(--safe-bottom));
  animation: slideUp .3s ease;
}
@keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
.modal-sheet h3 {
  font-size: 18px; font-weight: 600;
  text-align: center; margin-bottom: 20px;
  color: var(--c-primary);
}
.modal-close {
  position: absolute; top: 16px; right: 16px;
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--c-light-purple);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: var(--c-primary);
}

/* ═══════════════════════════════════════════
   成品展示：瀑布流
   ═══════════════════════════════════════════ */
.filter-bar {
  display: flex; gap: 8px; padding: 12px 16px;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
}
.filter-bar::-webkit-scrollbar { display: none; }
.filter-chip {
  flex-shrink: 0; padding: 6px 16px;
  border-radius: 20px; font-size: 13px; font-weight: 500;
  background: var(--c-white); color: var(--c-gray-purple);
  border: 1.5px solid var(--c-light-purple);
  transition: all .2s;
}
.filter-chip.active {
  background: var(--c-primary); color: #fff;
  border-color: var(--c-primary);
}
.waterfall {
  column-count: 2; column-gap: 12px;
  padding: 0 16px;
}
.waterfall-item {
  break-inside: avoid;
  margin-bottom: 12px;
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--c-white);
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform .2s;
}
.waterfall-item:active { transform: scale(0.97); }
.waterfall-item .cover {
  width: 100%; aspect-ratio: 3/4;
  object-fit: cover;
}
.waterfall-item .pin-badge {
  position: absolute; top: 8px; left: 8px;
  background: var(--c-primary); color: #fff;
  font-size: 10px; padding: 2px 8px;
  border-radius: 10px;
}
.waterfall-item .info {
  padding: 10px 12px;
}
.waterfall-item .info h4 {
  font-size: 14px; font-weight: 500;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.waterfall-item .info .cat {
  font-size: 12px; color: var(--c-gray-purple); margin-top: 2px;
}

/* ═══════════════════════════════════════════
   作品详情抽屉
   ═══════════════════════════════════════════ */
.detail-drawer {
  position: fixed; inset: 0; z-index: 400;
  background: var(--c-white);
  transform: translateX(100%);
  transition: transform .35s cubic-bezier(.4,0,.2,1);
  overflow-y: auto;
}
.detail-drawer.open { transform: translateX(0); }
.carousel {
  position: relative; overflow: hidden;
  width: 100%; aspect-ratio: 3/4;
  background: #f5f0f5;
}
.carousel-track {
  display: flex; transition: transform .3s ease;
  height: 100%;
}
.carousel-track img {
  width: 100%; height: 100%;
  object-fit: cover; flex-shrink: 0;
}
.carousel-dots {
  position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 6px;
}
.carousel-dots .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: rgba(255,255,255,0.5);
}
.carousel-dots .dot.active { background: #fff; width: 18px; border-radius: 3px; }
.detail-body { padding: 20px 16px; }
.detail-body h2 { font-size: 20px; margin-bottom: 8px; }
.detail-body .desc {
  font-size: 14px; color: var(--c-text-light);
  line-height: 1.8; margin-bottom: 16px;
  white-space: pre-wrap;
}

/* ═══════════════════════════════════════════
   排单列表
   ═══════════════════════════════════════════ */
.queue-section { padding: 0 16px; }
.queue-month-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 0 8px; cursor: pointer;
}
.queue-month-header h3 {
  font-size: 16px; font-weight: 600; color: var(--c-primary);
}
.queue-month-header .stats {
  display: flex; gap: 12px; font-size: 12px; color: var(--c-text-light);
}
.queue-month-header .stats .full { color: var(--c-danger); font-weight: 600; }
.queue-month-header .arrow {
  transition: transform .2s; font-size: 14px; color: var(--c-gray-purple);
}
.queue-month-header .arrow.collapsed { transform: rotate(-90deg); }
.queue-tip {
  background: var(--c-beige);
  border-radius: var(--radius);
  padding: 12px 16px;
  margin: 0 16px 12px;
  font-size: 14px;
  color: var(--c-primary);
  display: flex; align-items: center; gap: 8px;
}

.queue-card {
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 12px;
  position: relative;
  transition: transform .15s;
}
.queue-card:active { transform: scale(0.98); }

/* 排队中 */
.queue-card.status-queued {
  background: var(--c-light-purple);
}
/* 制作中 */
.queue-card.status-in_progress {
  background: linear-gradient(135deg, var(--c-primary), var(--c-secondary));
  color: #fff;
}
.queue-card.status-in_progress .qc-sub { color: rgba(255,255,255,0.8); }
/* 已完成 */
.queue-card.status-completed {
  background: var(--c-gray-purple);
  opacity: 0.55;
}
/* 我的 */
.queue-card.is-mine {
  background: var(--c-beige) !important;
  border-left: 4px solid var(--c-primary);
  color: var(--c-text) !important;
  opacity: 1 !important;
}
.queue-card.is-mine .qc-sub { color: var(--c-text-light) !important; }
.queue-card .mine-badge {
  position: absolute; top: -4px; right: -4px;
  background: var(--c-primary); color: #fff;
  font-size: 10px; padding: 2px 8px;
  border-radius: 0 var(--radius) 0 8px;
}
.qc-left { flex: 1; }
.qc-no { font-size: 12px; opacity: .7; }
.qc-name { font-weight: 600; font-size: 15px; margin: 2px 0; }
.qc-sub { font-size: 12px; color: var(--c-text-light); }
.qc-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.qc-rush {
  background: var(--c-danger); color: #fff;
  font-size: 10px; padding: 2px 8px;
  border-radius: 10px; font-weight: 600;
}
.qc-dots {
  display: flex; gap: 3px;
}
.qc-dots .dot {
  width: 8px; height: 8px; border-radius: 50%;
  border: 1.5px solid currentColor;
}
.qc-dots .dot.done { background: currentColor; }

/* ═══════════════════════════════════════════
   申请表单
   ═══════════════════════════════════════════ */
.form-group {
  margin-bottom: 18px;
}
.form-group label {
  display: block; font-size: 14px; font-weight: 500;
  margin-bottom: 6px; color: var(--c-text);
}
.form-group label .required { color: var(--c-danger); }
.img-picker-group { margin-bottom: 20px; }
.img-picker-group .title {
  font-size: 14px; font-weight: 500; margin-bottom: 8px;
}
.img-picker-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
}
.img-picker-cell {
  aspect-ratio: 1; border-radius: var(--radius);
  border: 1.5px dashed var(--c-light-purple);
  display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden; cursor: pointer;
  background: var(--c-bg);
  font-size: 24px; color: var(--c-gray-purple);
}
.img-picker-cell img {
  width: 100%; height: 100%; object-fit: cover;
}
.img-picker-cell .remove {
  position: absolute; top: 4px; right: 4px;
  width: 20px; height: 20px; border-radius: 50%;
  background: rgba(0,0,0,0.5); color: #fff;
  font-size: 12px; display: flex; align-items: center; justify-content: center;
}
.fold-section {
  border: 1.5px solid var(--c-light-purple);
  border-radius: var(--radius);
  overflow: hidden; margin-bottom: 18px;
}
.fold-header {
  padding: 12px 16px;
  display: flex; justify-content: space-between; align-items: center;
  cursor: pointer;
  font-size: 14px; font-weight: 500;
  background: var(--c-bg);
}
.fold-body { padding: 16px; display: none; }
.fold-section.open .fold-body { display: block; }
.measure-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
}
.switch-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 0;
}
.toggle {
  width: 48px; height: 28px; border-radius: 14px;
  background: var(--c-gray-purple);
  position: relative; cursor: pointer;
  transition: background .2s;
}
.toggle.on { background: var(--c-primary); }
.toggle::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 24px; height: 24px; border-radius: 50%;
  background: #fff; transition: transform .2s;
}
.toggle.on::after { transform: translateX(20px); }

/* ═══════════════════════════════════════════
   订单 & 详情
   ═══════════════════════════════════════════ */
.order-card {
  background: var(--c-white);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px; margin-bottom: 12px;
  cursor: pointer; position: relative;
  transition: transform .15s;
}
.order-card:active { transform: scale(0.98); }
.order-card .unread-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--c-danger);
  position: absolute; top: 12px; right: 12px;
}
.order-card .oc-no { font-size: 12px; color: var(--c-gray-purple); }
.order-card .oc-title { font-size: 16px; font-weight: 600; margin: 4px 0; }
.order-card .oc-status {
  display: inline-block; padding: 2px 10px;
  border-radius: 10px; font-size: 12px; font-weight: 500;
}
.oc-status.queued { background: var(--c-light-purple); color: var(--c-primary); }
.oc-status.in_progress { background: var(--c-primary); color: #fff; }
.oc-status.completed { background: var(--c-gray-purple); color: #fff; }

/* 时间线 */
.timeline { padding: 0 16px 16px; }
.timeline-node {
  display: flex; gap: 16px;
  padding-bottom: 0;
  position: relative;
}
.timeline-line {
  width: 24px; display: flex; flex-direction: column; align-items: center;
  flex-shrink: 0;
}
.timeline-dot {
  width: 18px; height: 18px; border-radius: 50%;
  border: 2px solid var(--c-gray-purple);
  background: var(--c-white);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; flex-shrink: 0;
  position: relative; z-index: 2;
}
.timeline-node.done .timeline-dot {
  background: var(--c-primary); border-color: var(--c-primary); color: #fff;
}
.timeline-node.current .timeline-dot {
  border-color: var(--c-primary);
  animation: breathe 2s ease-in-out infinite;
}
@keyframes breathe {
  0%,100%{ transform:scale(1); box-shadow:0 0 0 0 rgba(116,96,151,0.3); }
  50%{ transform:scale(1.2); box-shadow:0 0 0 8px rgba(116,96,151,0); }
}
.timeline-node.skipped .timeline-dot {
  background: var(--c-gray-purple); border-color: var(--c-gray-purple);
}
.timeline-node.skipped .tl-name { text-decoration: line-through; color: var(--c-gray-purple); }
.timeline-connector {
  width: 2px; flex: 1; background: var(--c-light-purple); min-height: 28px;
}
.timeline-node.done .timeline-connector { background: var(--c-primary); }
.tl-content { flex: 1; padding-bottom: 20px; }
.tl-name { font-size: 14px; font-weight: 500; }
.tl-time { font-size: 12px; color: var(--c-gray-purple); margin-top: 2px; }
.tl-photos {
  display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap;
}
.tl-photos img {
  width: 56px; height: 56px; border-radius: 8px; object-fit: cover;
  cursor: pointer;
}

/* 材料清单 */
.material-card {
  border: 1.5px solid var(--c-light-purple);
  border-radius: var(--radius);
  padding: 14px; margin-bottom: 10px;
}
.material-card .mc-name { font-weight: 600; font-size: 15px; }
.material-card .mc-spec { font-size: 12px; color: var(--c-gray-purple); }
.material-card .mc-row {
  display: flex; justify-content: space-between; margin-top: 6px;
  font-size: 13px;
}
.material-card .mc-images {
  display: flex; gap: 8px; margin-top: 8px;
}
.material-card .mc-images .mc-img-box {
  width: 72px; height: 72px; border-radius: 8px;
  overflow: hidden; position: relative;
}
.material-card .mc-images .mc-img-box img {
  width: 100%; height: 100%; object-fit: cover;
}
.material-card .mc-images .mc-label {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: rgba(0,0,0,0.5); color: #fff;
  font-size: 10px; text-align: center; padding: 2px;
}
.material-total {
  text-align: right; font-size: 16px; font-weight: 600;
  color: var(--c-primary); padding: 12px 0;
}

/* 聊天气泡 */
.chat-area { padding: 16px; }
.chat-bubble {
  max-width: 80%; margin-bottom: 12px;
  display: flex; flex-direction: column;
}
.chat-bubble.mine { align-self: flex-end; margin-left: auto; }
.chat-bubble.other { align-self: flex-start; }
.chat-bubble .cb-name { font-size: 11px; color: var(--c-gray-purple); margin-bottom: 2px; }
.chat-bubble .cb-body {
  padding: 10px 14px; border-radius: 16px;
  font-size: 14px; line-height: 1.5;
}
.chat-bubble.mine .cb-body {
  background: var(--c-primary); color: #fff;
  border-bottom-right-radius: 4px;
}
.chat-bubble.other .cb-body {
  background: var(--c-light-purple); color: var(--c-text);
  border-bottom-left-radius: 4px;
}
.chat-bubble.notification .cb-body {
  background: var(--c-beige); color: var(--c-text);
  text-align: center; font-size: 13px;
  border-radius: var(--radius);
}
.chat-bubble .cb-body img {
  max-width: 200px; border-radius: 8px; margin-top: 6px;
}
.chat-bubble .cb-time { font-size: 11px; color: var(--c-gray-purple); margin-top: 4px; }
.chat-input-bar {
  display: flex; gap: 8px; align-items: flex-end;
  padding: 12px 16px;
  background: var(--c-white);
  border-top: 1px solid var(--c-light-purple);
}
.chat-input-bar textarea {
  flex: 1; min-height: 36px; max-height: 100px;
  border-radius: 18px; padding: 8px 14px;
  resize: none;
}
.chat-input-bar .chat-img-btn {
  width: 36px; height: 36px; border-radius: 50%;

/* ═══════════════════════════════════════════

/** Toast 提示 */
function toast(msg, type = 'info') {
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

/** 显示/隐藏元素 */
function show(id) {
  const el = typeof id === 'string' ? document.getElementById(id) : id;
  if (el) el.style.display = '';
}
function hide(id) {
  const el = typeof id === 'string' ? document.getElementById(id) : id;
  if (el) el.style.display = 'none';
}

/** 日期格式化 */
function fmtDate(str) {
  if (!str) return '';
  const d = new Date(str);
  return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function fmtDay(str) {
  if (!str) return '';
  const d = new Date(str);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtMonth(m) {
  if (!m) return '未排期';
  const [y, mo] = m.split('-');
  return `${y}年${parseInt(mo)}月`;
}
function getCurrentMonth() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

/** 脱敏姓名 */
function maskName(name) {
  if (!name || name.length < 2) return name || '';
  return name[0] + '*'.repeat(name.length - 1);
}

/** 状态文字 */
function statusText(s) {
  return { queued: '排队中', in_progress: '制作中', completed: '已完成' }[s] || s;
}
function appStatusText(s) {
  return { pending: '待处理', accepted: '已接单', rejected: '已拒绝' }[s] || s;
}
function matStatusText(s) {
  return { pending: '待采购', ordered: '已下单', arrived: '已到货' }[s] || s;
}

/** 图片压缩（长边 1600，质量 0.8） */
function compressImage(file, maxSize = 1600, quality = 0.8) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width;
        let h = img.height;
        if (w > h && w > maxSize) {
          h = Math.round(h * maxSize / w);
          w = maxSize;
        } else if (h > maxSize) {
          w = Math.round(w * maxSize / h);
          h = maxSize;
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        canvas.toBlob((blob) => resolve(blob), 'image/jpeg', quality);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

/** 上传图片到 Storage */
async function uploadImage(bucket, file) {
  const compressed = await compressImage(file);
  const ext = 'jpg';
  const path = `${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
  const { data, error } = await sb.storage.from(bucket).upload(path, compressed, {
    contentType: 'image/jpeg'
  });
  if (error) {
    toast('图片上传失败: ' + error.message, 'error');
    return null;
  }
  const { data: urlData } = sb.storage.from(bucket).getPublicUrl(path);
  return urlData.publicUrl;
}

/** 打开图片预览 */
function previewImg(src) {
  document.getElementById('imgPreviewSrc').src = src;
  document.getElementById('imgPreview').classList.add('active');
}
function closeImgPreview() {
  document.getElementById('imgPreview').classList.remove('active');
}

/** 折叠面板 */
function toggleFold(id) {
  document.getElementById(id).classList.toggle('open');
}

/** Storage 公开 URL */
function storageUrl(bucket, path) {
  if (!path) return '';
  if (path.startsWith('http')) return path;
  const { data } = sb.storage.from(bucket).getPublicUrl(path);
  return data.publicUrl;
}

/* ═══════════════════════════════════════════
   2. 路由系统
   ═══════════════════════════════════════════ */
const mainPages = ['works', 'queue', 'apply', 'orders', 'profile'];

function navigateTo(page, params = {}) {
  let hash = page;
  if (params.id) hash += '/' + params.id;
  location.hash = hash;
}

function handleRoute() {
  const hash = location.hash.slice(1) || 'works';
  const parts = hash.split('/');
  const page = parts[0];
  const subId = parts[1] || null;

  // 隐藏所有页面
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));

  // 底部 tab 高亮
  const isAdminPage = page === 'admin';
  document.getElementById('tabBar').style.display = isAdminPage ? 'none' : '';
  document.querySelectorAll('.tab-item').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === (mainPages.includes(page) ? page : ''));
  });

  if (page === 'orderDetail' && subId) {
    document.getElementById('page-orderDetail').classList.add('active');
    loadOrderDetail(subId);
    return;
  }

  if (page === 'admin') {
    document.getElementById('page-admin').classList.add('active');
    initAdmin(subId || 'dashboard');
    return;
  }

  // 主页面
  const pageEl = document.getElementById('page-' + page);
  if (pageEl) {
    pageEl.classList.add('active');
    // 触发页面加载
    if (page === 'works') loadWorks();
    else if (page === 'queue') loadQueue();
    else if (page === 'apply') initApplyForm();
    else if (page === 'orders') loadMyOrders();
    else if (page === 'profile') renderProfile();
  } else {
    // 默认回成品
    document.getElementById('page-works').classList.add('active');
    loadWorks();
  }
}

window.addEventListener('hashchange', handleRoute);

// Tab 点击
document.getElementById('tabBar').addEventListener('click', (e) => {
  const tab = e.target.closest('.tab-item');
  if (tab) navigateTo(tab.dataset.tab);
});

function phoneToEmail(phone) {
  return `${phone}@studio.local`;
}

function openAuthModal(form = 'login') {
  document.getElementById('authModal').classList.add('active');
  showAuthForm(form);
}
function closeAuthModal() {
  document.getElementById('authModal').classList.remove('active');
}
function showAuthForm(form) {
  hide('authFormLogin');
  hide('authFormRegister');
  hide('authFormReset');
  show('authForm' + form.charAt(0).toUpperCase() + form.slice(1));
}

/** 登录 */
async function doLogin() {
  const phone = document.getElementById('loginPhone').value.trim();
  const pwd = document.getElementById('loginPwd').value;
  if (!phone || !pwd) return toast('请填写手机号和密码', 'error');

  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.textContent = '登录中…';

  const { data, error } = await sb.auth.signInWithPassword({
    email: phoneToEmail(phone),
    password: pwd
  });

  btn.disabled = false;
  btn.textContent = '登录';

  if (error) {
    toast('登录失败: ' + error.message, 'error');
    return;
  }
  toast('登录成功！', 'success');
  closeAuthModal();
  await loadUserProfile();
  handleRoute();

  // 检查是否有待提交的申请草稿
  trySubmitDraft();
}

/** 注册 */
async function doRegister() {
  const phone = document.getElementById('regPhone').value.trim();
  const nick = document.getElementById('regNick').value.trim();
  const pwd = document.getElementById('regPwd').value;
  const secQ = document.getElementById('regSecQ').value.trim();
  const secA = document.getElementById('regSecA').value.trim();

  if (!phone || !pwd) return toast('手机号和密码必填', 'error');
  if (phone.length !== 11) return toast('请输入11位手机号', 'error');
  if (pwd.length < 6) return toast('密码至少6位', 'error');
  if (!secQ || !secA) return toast('密保问题和答案必填', 'error');

  const btn = document.getElementById('regBtn');
  btn.disabled = true;
  btn.textContent = '注册中…';

  const { data, error } = await sb.auth.signUp({
    email: phoneToEmail(phone),
    password: pwd
  });

  if (error) {
    btn.disabled = false;
    btn.textContent = '注册';
    toast('注册失败: ' + error.message, 'error');
    return;
  }

  // 更新 profiles（触发器已创建基础记录）
  const userId = data.user.id;
  const { error: profErr } = await sb.from('profiles').update({
    nickname: nick || ('用户' + phone.slice(-4)),
    security_question: secQ,
    security_answer: secA
  }).eq('id', userId);

  btn.disabled = false;
  btn.textContent = '注册';

  if (profErr) {
    toast('资料保存失败: ' + profErr.message, 'error');
  }

  toast('注册成功！', 'success');
  closeAuthModal();
  await loadUserProfile();
  handleRoute();
  trySubmitDraft();
}

/** 密保重置密码 */
async function doResetPwd() {
  const phone = document.getElementById('resetPhone').value.trim();
  const secA = document.getElementById('resetSecA').value.trim();
  const newPwd = document.getElementById('resetNewPwd').value;

  if (!phone || !secA || !newPwd) return toast('请填写全部信息', 'error');
  if (newPwd.length < 6) return toast('密码至少6位', 'error');

  // 验证密保
  const { data: prof, error: pErr } = await sb.from('profiles')
    .select('id, security_answer')
    .eq('phone', phone)
    .single();

  if (pErr || !prof) return toast('未找到该手机号对应的账号', 'error');
  if (prof.security_answer !== secA) return toast('密保答案错误', 'error');

  // 先登录才能改密码 — 这里用 admin API 不可行
  // 方案：用密保验证后，让用户先用旧密码登录 → 改密码
  // 但用户忘了密码... 只能通过服务端改
  // 在纯前端方案中，我们使用一个 workaround：
  // 实际项目应用 Edge Function。这里简化：提示用户联系管理员
  toast('密保验证通过，请联系管理员重置密码', 'info');
}

/** 加载用户资料 */
async function loadUserProfile() {
  const { data: { user } } = await sb.auth.getUser();
  currentUser = user;
  if (!user) {
    currentProfile = null;
    return;
  }
  const { data, error } = await sb.from('profiles')
    .select('*')
    .eq('id', user.id)
    .single();
  if (!error && data) {
    currentProfile = data;
  }
}

/** 退出登录 */
async function doLogout() {
  await sb.auth.signOut();
  currentUser = null;
  currentProfile = null;
  toast('已退出登录', 'info');
  navigateTo('works');
}

/* ═══════════════════════════════════════════
   4. 成品展示模块
   ═══════════════════════════════════════════ */
let worksData = [];
let categoriesData = [];
let selectedCategory = null;

async function loadWorks() {
  show('worksLoading');
  hide('worksGrid');

  // 加载分类
  if (categoriesData.length === 0) {
    const { data: cats } = await sb.from('categories')
      .select('*')
      .order('sort_order');
    categoriesData = cats || [];
    renderCategoryFilter();
  }

  // 加载作品
  let query = sb.from('works')
    .select('*, categories(name)')
    .eq('is_hidden', false)
    .order('is_pinned', { ascending: false })
    .order('sort_order', { ascending: true })
    .order('created_at', { ascending: false });

  if (selectedCategory) {
    query = query.eq('category_id', selectedCategory);
  }

  const { data, error } = await query;
  hide('worksLoading');

  if (error) {
    toast('加载失败: ' + error.message, 'error');
    return;
  }

  worksData = data || [];
  renderWaterfall();
}

function renderCategoryFilter() {
  const container = document.getElementById('worksFilter');
  let html = `<button class="filter-chip ${!selectedCategory ? 'active' : ''}" onclick="filterCategory(null)">全部</button>`;
  categoriesData.forEach(c => {
    html += `<button class="filter-chip ${selectedCategory === c.id ? 'active' : ''}" onclick="filterCategory('${c.id}')">${c.name}</button>`;
  });
  container.innerHTML = html;
}

function filterCategory(catId) {
  selectedCategory = catId;
  renderCategoryFilter();
  loadWorks();
}

function renderWaterfall() {
  const container = document.getElementById('worksGrid');
  show(container);
  if (!worksData.length) {
    container.innerHTML = '<p style="text-align:center;padding:40px;color:var(--c-text-light);">暂无作品</p>';
    return;
  }
  let html = '';
  worksData.forEach(w => {
    html += `
      <div class="waterfall-item" onclick="openWorkDetail('${w.id}')" style="position:relative;">
        ${w.is_pinned ? '<div class="pin-badge">📌 置顶</div>' : ''}
        <img class="cover" src="${w.cover_image}" alt="${w.title}"
             loading="lazy" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 3 4%22><rect fill=%22%23ECD9ED%22 width=%223%22 height=%224%22/></svg>'">
        <div class="info">
          <h4>${w.title}</h4>
          <div class="cat">${w.categories?.name || ''}</div>
        </div>
      </div>`;

  container.innerHTML = html;
}

/** 作品详情 */
async function openWorkDetail(id) {
  const work = worksData.find(w => w.id === id);
  if (!work) return;

  // 加载详情图
  const { data: imgs } = await sb.from('work_images')
    .select('*')
    .eq('work_id', id)
    .order('sort_order');

  const allImgs = [work.cover_image, ...(imgs || []).map(i => i.image_url)].filter(Boolean);

  // 渲染轮播
  const track = document.querySelector('#workCarousel .carousel-track');
  const dots = document.querySelector('#workCarousel .carousel-dots');
  track.innerHTML = allImgs.map(src => `<img src="${src}" alt="">`).join('');
  dots.innerHTML = allImgs.map((_, i) => `<div class="dot ${i === 0 ? 'active' : ''}"></div>`).join('');

  // 轮播逻辑
  initCarousel('workCarousel', allImgs.length);

  // 详情内容
  let bodyHtml = `<h2>${work.title}</h2>
    <div class="desc">${work.description || '暂无描述'}</div>`;

  // 关联订单的流程回顾
  if (work.order_id) {
    const { data: nodes } = await sb.from('order_nodes')
      .select('*')
      .eq('order_id', work.order_id)
      .order('sort_order');
    if (nodes && nodes.length) {
      bodyHtml += `<h3 style="font-size:16px;margin:16px 0 12px;">🕐 制作回顾</h3>`;
      bodyHtml += renderMiniTimeline(nodes);
    }
  }

  bodyHtml += `<div style="margin-top:24px;">
    <button class="btn btn-primary btn-block" onclick="sameStyleApply('${work.title}')">
      ✨ 同款定制
    </button>
  </div>`;

  document.getElementById('workDetailBody').innerHTML = bodyHtml;
  document.getElementById('workDetail').classList.add('open');
}

function closeWorkDetail() {
  document.getElementById('workDetail').classList.remove('open');
}

function sameStyleApply(title) {
  closeWorkDetail();
  navigateTo('apply');
  setTimeout(() => {
    document.getElementById('applyReq').value = `想定制同款：${title}`;
  }, 100);
}

function renderMiniTimeline(nodes) {
  let html = '<div style="padding-left:8px;">';
  nodes.forEach((n, i) => {
    const isDone = n.status === 'completed';
    const isSkip = n.status === 'skipped';
    html += `<div style="display:flex;gap:10px;align-items:flex-start;margin-bottom:4px;">
      <div style="width:12px;height:12px;border-radius:50%;margin-top:4px;flex-shrink:0;
        background:${isDone ? 'var(--c-primary)' : isSkip ? 'var(--c-gray-purple)' : 'var(--c-light-purple)'};"></div>
      <span style="font-size:13px;${isSkip ? 'text-decoration:line-through;color:var(--c-gray-purple);' : ''}">${n.node_name}${isDone && n.completed_at ? ' · ' + fmtDate(n.completed_at) : ''}</span>
    </div>`;
  });
  html += '</div>';
  return html;
}

/** 简易轮播 */
function initCarousel(containerId, count) {
  if (count <= 1) return;
  const container = document.getElementById(containerId);
  const track = container.querySelector('.carousel-track');
  const dots = container.querySelectorAll('.dot');
  let current = 0;
  let startX = 0;

  track.addEventListener('touchstart', (e) => {
    startX = e.touches[0].clientX;
  });
  track.addEventListener('touchend', (e) => {
    const diff = startX - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 50) {
      current = diff > 0
        ? Math.min(current + 1, count - 1)
        : Math.max(current - 1, 0);
      track.style.transform = `translateX(-${current * 100}%)`;
      dots.forEach((d, i) => d.classList.toggle('active', i === current));
    }
  });
}

/* ═══════════════════════════════════════════
   5. 排单列表模块
   ═══════════════════════════════════════════ */
async function loadQueue() {
  show('queueLoading');
  hide('queueList');
  hide('queueTip');

  const [queueRes, msRes] = await Promise.all([
    sb.from('public_queue').select('*'),
    sb.from('month_settings').select('*')
  ]);

  hide('queueLoading');

  if (queueRes.error) {
    toast('排单加载失败: ' + queueRes.error.message, 'error');
    return;
  }

  const items = queueRes.data || [];
  const monthSettings = {};
  (msRes.data || []).forEach(ms => { monthSettings[ms.month] = ms; });

  const curMonth = getCurrentMonth();

  // 前面有多少单
  if (currentUser) {
    const myItems = items.filter(i => i.user_id === currentUser.id && i.status !== 'completed');
    if (myItems.length) {
      const firstMine = myItems[0];
      const ahead = items.filter(i =>
        i.status !== 'completed' &&
        i.user_id !== currentUser.id &&
        (i.schedule_month < firstMine.schedule_month ||
          (i.schedule_month === firstMine.schedule_month &&
            items.indexOf(i) < items.indexOf(firstMine)))
      ).length;
      const tip = document.getElementById('queueTip');
      tip.innerHTML = `🔔 你前面还有 <strong>${ahead}</strong> 单`;
      show(tip);
    }
  }

  // 按月分组
  const groups = {};
  items.forEach(item => {
    const m = item.schedule_month || '未排期';
    if (!groups[m]) groups[m] = [];
    groups[m].push(item);
  });

  // 月内排序：已完成沉底
  Object.values(groups).forEach(list => {
    list.sort((a, b) => {
      if (a.status === 'completed' && b.status !== 'completed') return 1;
      if (a.status !== 'completed' && b.status === 'completed') return -1;
      return 0;  // 已被视图排好序
    });
  });

  // 渲染
  const container = document.getElementById('queueList');
  show(container);

  const months = Object.keys(groups).sort();
  let html = '';

  months.forEach(m => {
    const list = groups[m];
    const ms = monthSettings[m] || { normal_limit: 8, rush_limit: 2 };
    const normalCount = list.filter(i => !i.is_rush && i.status !== 'completed').length;
    const rushCount = list.filter(i => i.is_rush && i.status !== 'completed').length;
    const normalFull = normalCount >= ms.normal_limit;
    const rushFull = rushCount >= ms.rush_limit;
    const isCurrentMonth = m === curMonth;
    const isFuture = m > curMonth;
    const collapsed = m < curMonth;

    html += `<div class="queue-month-group">
      <div class="queue-month-header" onclick="toggleQueueMonth(this)">
        <h3>${fmtMonth(m)}${isFuture ? ' 🔜 预排' : ''}</h3>
        <div class="stats">
          <span>普通 ${normalCount}/${ms.normal_limit} ${normalFull ? '<span class="full">满</span>' : ''}</span>
          <span>加塞 ${rushCount}/${ms.rush_limit} ${rushFull ? '<span class="full">满</span>' : ''}</span>
        </div>
        <span class="arrow ${collapsed ? 'collapsed' : ''}">▼</span>
      </div>
      <div class="queue-month-body" style="${collapsed ? 'display:none;' : ''}">`;

    list.forEach(item => {
      const isMine = currentUser && item.user_id === currentUser.id;
      const nodes = Array.isArray(item.nodes) ? item.nodes : (typeof item.nodes === 'string' ? JSON.parse(item.nodes) : []);

      html += `<div class="queue-card status-${item.status} ${isMine ? 'is-mine' : ''}"
        onclick="onQueueCardClick('${item.id}', ${isMine})" >
        ${isMine ? '<span class="mine-badge">我的</span>' : ''}
        <div class="qc-left">
          <div class="qc-no">${item.order_no}</div>
          <div class="qc-name">${item.customer_name} · ${item.project_name}</div>
          <div class="qc-sub">预估 ${item.estimated_time || '待定'}</div>
        </div>
        <div class="qc-right">
          ${item.is_rush ? '<span class="qc-rush">加急</span>' : ''}
          <div class="qc-dots">${renderNodeDots(nodes)}</div>
        </div>
      </div>`;
    });

    html += '</div></div>';
  });

  container.innerHTML = html || '<p style="text-align:center;padding:40px;color:var(--c-text-light);">暂无排单</p>';
}

function renderNodeDots(nodes) {
  return nodes.map(n =>
    `<span class="dot ${n.status === 'completed' ? 'done' : ''}" title="${n.node_name}"></span>`
  ).join('');
}

function toggleQueueMonth(header) {
  const body = header.nextElementSibling;
  const arrow = header.querySelector('.arrow');
  const hidden = body.style.display === 'none';
  body.style.display = hidden ? '' : 'none';
  arrow.classList.toggle('collapsed', !hidden);
}

function onQueueCardClick(id, isMine) {
  if (isMine) {
    navigateTo('orderDetail', { id });
  } else {
    toast('只能查看自己的订单详情哦', 'info');
  }
}

/* ═══════════════════════════════════════════
   6. 申请订单模块
   ═══════════════════════════════════════════ */

function initApplyForm() {
  // 恢复草稿
  const draft = localStorage.getItem('applyDraft');
  if (draft) {
    try {
      const d = JSON.parse(draft);
      if (d.name) document.getElementById('applyName').value = d.name;
      if (d.contact) document.getElementById('applyContact').value = d.contact;
      if (d.requirement) document.getElementById('applyReq').value = d.requirement;
      if (d.budget) document.getElementById('applyBudget').value = d.budget;
      if (d.expectedTime) document.getElementById('applyTime').value = d.expectedTime;
      if (d.special) document.getElementById('applySpecial').value = d.special;
    } catch(e) {}
  }
  renderAllImagePickers();
  show('applyForm');
  hide('applyResult');
}

function renderAllImagePickers() {
  ['design', 'style', 'detail'].forEach(group => {
    renderImagePicker(group);
  });
}

function renderImagePicker(group) {
  const containerId = group === 'design' ? 'designImgs' : group === 'style' ? 'styleImgs' : 'detailImgs';
  const container = document.getElementById(containerId);
  const imgs = applyImages[group] || [];
  let html = '';
  imgs.forEach((src, i) => {
    html += `<div class="img-picker-cell">
      <img src="${src}" onclick="previewImg('${src}')">
      <div class="remove" onclick="event.stopPropagation();removeApplyImg('${group}',${i})">✕</div>
    </div>`;
  });
  if (imgs.length < 6) {
    html += `<div class="img-picker-cell" onclick="pickApplyImages('${group}')">+</div>`;
  }
  container.innerHTML = html;
}

function pickApplyImages(group) {
  const input = document.getElementById('fileInput');
  input.value = '';
  input.multiple = true;
  fileInputCallback = async (files) => {
    const remain = 6 - (applyImages[group] || []).length;
    const toUpload = Array.from(files).slice(0, remain);
    for (const file of toUpload) {
      const blob = await compressImage(file);
      const reader = new FileReader();
      reader.onload = (e) => {
        applyImages[group].push(e.target.result);
        renderImagePicker(group);
      };
      reader.readAsDataURL(blob);
    }
  };
  input.click();
}

function removeApplyImg(group, index) {
  applyImages[group].splice(index, 1);
  renderImagePicker(group);
}

document.getElementById('fileInput').addEventListener('change', (e) => {
  if (fileInputCallback && e.target.files.length) {
    fileInputCallback(e.target.files);
    fileInputCallback = null;
  }
});

function getBodyMeasurements() {
  const fields = ['height','weight','bust','waist','hip','shoulder','sleeve','length'];
  const result = {};
  fields.forEach(f => {
    const v = document.getElementById('m_' + f).value;
    if (v) result[f] = parseFloat(v);
  });
  return result;
}

async function submitApplication() {
  const name = document.getElementById('applyName').value.trim();
  const contact = document.getElementById('applyContact').value.trim();
  if (!name || !contact) return toast('称呼和联系方式必填', 'error');

  // 未登录 → 存草稿 → 弹登录
  if (!currentUser) {
    localStorage.setItem('applyDraft', JSON.stringify({
      name, contact,
      requirement: document.getElementById('applyReq').value,
      budget: document.getElementById('applyBudget').value,
      expectedTime: document.getElementById('applyTime').value,
      special: document.getElementById('applySpecial').value,
      isRush: document.getElementById('applyRush').classList.contains('on')
    }));
    toast('请先登录后再提交', 'info');
    openAuthModal('login');
    return;
  }

  const btn = document.getElementById('applySubmitBtn');
  btn.disabled = true;
  btn.textContent = '提交中…';

  // 上传图片到 Storage
  const uploadGroup = async (group) => {
    const urls = [];
    for (const dataUrl of applyImages[group]) {
      if (dataUrl.startsWith('http')) {
        urls.push(dataUrl);
        continue;
      }
      // dataUrl → blob → upload
      const resp = await fetch(dataUrl);
      const blob = await resp.blob();
      const file = new File([blob], 'img.jpg', { type: 'image/jpeg' });
      const url = await uploadImage('app-images', file);
      if (url) urls.push(url);
    }
    return urls;
  };

  const [designUrls, styleUrls, detailUrls] = await Promise.all([
    uploadGroup('design'),
    uploadGroup('style'),
    uploadGroup('detail')
  ]);

  const { error } = await sb.from('applications').insert({
    user_id: currentUser.id,
    name,
    contact,
    requirement: document.getElementById('applyReq').value,
    budget: document.getElementById('applyBudget').value,
    expected_time: document.getElementById('applyTime').value,
    is_rush: document.getElementById('applyRush').classList.contains('on'),
    design_images: designUrls,
    style_images: styleUrls,
    detail_images: detailUrls,
    body_measurements: getBodyMeasurements(),
    special_notes: document.getElementById('applySpecial').value
  });

  btn.disabled = false;
  btn.textContent = '提交申请';

  if (error) {
    toast('提交失败: ' + error.message, 'error');
    return;
  }

  localStorage.removeItem('applyDraft');
  toast('提交成功！', 'success');
  hide('applyForm');
  show('applyResult');
}

function trySubmitDraft() {
  const draft = localStorage.getItem('applyDraft');
  if (draft && currentUser) {
    toast('检测到未提交的申请，请确认后提交', 'info');
    navigateTo('apply');
  }
}

function resetApplyForm() {
  document.getElementById('applyName').value = '';
  document.getElementById('applyContact').value = '';
  document.getElementById('applyReq').value = '';
  document.getElementById('applyBudget').value = '';
  document.getElementById('applyTime').value = '';
  document.getElementById('applySpecial').value = '';
  document.getElementById('applyRush').classList.remove('on');
  applyImages = { design: [], style: [], detail: [] };
  hide('applyResult');
  show('applyForm');
  renderAllImagePickers();
}

async function loadMyOrders() {
  if (!currentUser) {

    hide('ordersList');

    empty.style.display = 'flex';
    empty.innerHTML = `<div class="result-icon">🔒</div>

      <button class="btn btn-primary" onclick="openAuthModal()">去登录</button>`;
    return;
  }

  show('ordersLoading');
  hide('ordersList');
  hide('ordersEmpty');

  // 加载我的申请
  const { data: apps } = await sb.from('applications')
    .select('*')
    .eq('user_id', currentUser.id)
    .order('created_at', { ascending: false })
    .limit(5);

  // 加载我的订单
  const { data: orders, error } = await sb.from('orders')
    .select('*, order_nodes(*)')
    .eq('user_id', currentUser.id)
    .order('created_at', { ascending: false });

  // 加载未读消息数

    .select('order_id')
    .neq('user_id', currentUser.id)

  });

  if (error) {
    toast('订单加载失败: ' + error.message, 'error');
    return;
  }

  const container = document.getElementById('ordersList');
  show(container);
  let html = '';

  // 显示申请状态
  if (apps && apps.length) {
    const myAppBox = document.getElementById('myAppStatus');
    show(myAppBox);
    let appHtml = '<h3 style="font-size:15px;margin-bottom:8px;">📝 我的申请</h3>';
    apps.forEach(app => {
      const statusColor = app.status === 'pending' ? 'var(--c-beige)' :
        app.status === 'accepted' ? 'var(--c-light-purple)' : '#f5e0e0';
      appHtml += `<div class="card" style="padding:12px 14px;display:flex;justify-content:space-between;align-items:center;">
        <div>
          <div style="font-size:14px;font-weight:500;">${app.requirement ? app.requirement.slice(0,20) + '…' : '定制申请'}</div>
          <div style="font-size:12px;color:var(--c-text-light);">${fmtDate(app.created_at)}</div>
        </div>
        <span class="oc-status" style="background:${statusColor}">${appStatusText(app.status)}</span>
        ${app.status === 'rejected' && app.reject_reason ? `<div style="font-size:12px;color:var(--c-danger);margin-top:4px;">原因: ${app.reject_reason}</div>` : ''}
      </div>`;
    });
    myAppBox.innerHTML = appHtml;
  }

  if (!orders || !orders.length) {
    document.getElementById('ordersEmpty').style.display = 'flex';
    document.getElementById('ordersEmpty').innerHTML = `<div class="result-icon">📦</div>
      <p style="color:var(--c-text-light);font-size:14px;">暂无订单</p>`;
    return;
  }

  orders.forEach(o => {
    const hasUnread = unreadMap[o.id];
    html += `<div class="order-card" onclick="navigateTo('orderDetail',{id:'${o.id}'})">
      ${hasUnread ? '<div class="unread-dot"></div>' : ''}
      <div class="oc-no">${o.order_no}</div>

      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">
        <span class="oc-status ${o.status}">${statusText(o.status)}</span>
        <span style="font-size:12px;color:var(--c-text-light);">${fmtDate(o.updated_at)}</span>
      </div>
    </div>`;
  });

  container.innerHTML = html;
}

/* ═══════════════════════════════════════════
   8. 订单详情模块
   ═══════════════════════════════════════════ */
async function loadOrderDetail(id) {
  const container = document.getElementById('orderDetailContent');
  container.innerHTML = '<div class="skeleton skeleton-card"></div><div class="skeleton skeleton-card" style="height:200px;"></div>';

  // 并行加载
  const [orderRes, nodesRes, matsRes, msgsRes, photosRes] = await Promise.all([
    sb.from('orders').select('*').eq('id', id).single(),
    sb.from('order_nodes').select('*').eq('order_id', id).order('sort_order'),
    sb.from('materials').select('*').eq('order_id', id).order('created_at'),
    sb.from('messages').select('*, profiles:user_id(nickname, is_admin)').eq('order_id', id).order('created_at'),
    sb.from('node_photos').select('*, order_nodes!inner(order_id)').eq('order_nodes.order_id', id)
  ]);

  if (orderRes.error) {
    toast('订单加载失败: ' + orderRes.error.message, 'error');
    container.innerHTML = '<p style="text-align:center;padding:40px;">加载失败</p>';
    return;
  }

  const order = orderRes.data;
  const nodes = nodesRes.data || [];
  const mats = matsRes.data || [];
  const msgs = msgsRes.data || [];

  // 按 node_id 归类照片
  const photoMap = {};
  (photosRes.data || []).forEach(p => {
    if (!photoMap[p.node_id]) photoMap[p.node_id] = [];
    photoMap[p.node_id].push(p);
  });

  document.getElementById('odTitle').textContent = order.project_name;

  // 标记消息已读
  if (currentUser) {
    sb.from('messages')
      .update({ is_read: true })
      .eq('order_id', id)
      .neq('user_id', currentUser.id)
      .eq('is_read', false)
      .then(() => {});
  }

  let html = '';

  // 头部信息
  html += `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <span class="oc-status ${order.status}">${statusText(order.status)}</span>
      <span style="font-size:13px;color:var(--c-text-light);">${order.order_no}</span>
    </div>
    <div style="margin-top:8px;font-size:14px;">
      <div>排单月份：${fmtMonth(order.schedule_month)}</div>
      <div>预估完成：${order.estimated_time || '待定'}</div>
    </div>
  </div>`;

  // 备注区
  const canEditRemark = order.status === 'queued';
  html += `<div class="card">
    <h3 style="font-size:15px;margin-bottom:8px;">📝 备注</h3>
    <textarea id="remarkInput" ${canEditRemark ? '' : 'disabled'} placeholder="${canEditRemark ? '在此添加备注…' : '排队中才可编辑备注'}"
      style="${canEditRemark ? '' : 'background:#f5f0f5;'}">${order.remark || ''}</textarea>
    ${canEditRemark ? `<button class="btn btn-sm btn-secondary" style="margin-top:8px;" onclick="saveRemark('${order.id}')">保存修改</button>` : '<p style="font-size:12px;color:var(--c-text-light);margin-top:4px;">⚠️ 进入制作后备注将锁定</p>'}
  </div>`;

  // 时间线
  html += `<div class="card" style="padding-bottom:0;">
    <h3 style="font-size:15px;margin-bottom:16px;">📋 制作进度</h3>
    <div class="timeline">`;

  let currentFound = false;
  nodes.forEach((n, i) => {
    const isDone = n.status === 'completed';
    const isSkip = n.status === 'skipped';
    let className = '';
    if (isDone) className = 'done';
    else if (isSkip) className = 'skipped';
    else if (!currentFound) { className = 'current'; currentFound = true; }

    const photos = photoMap[n.id] || [];
    const isLast = i === nodes.length - 1;

    html += `<div class="timeline-node ${className}">
      <div class="timeline-line">
        <div class="timeline-dot">${isDone ? '✓' : isSkip ? '—' : ''}</div>
        ${!isLast ? '<div class="timeline-connector"></div>' : ''}
      </div>
      <div class="tl-content">
        <div class="tl-name">${n.node_name}</div>
        ${isDone ? `<div class="tl-time">${fmtDate(n.completed_at)}</div>` : ''}
        ${photos.length ? `<div class="tl-photos">${photos.map(p => `<img src="${p.image_url}" onclick="previewImg('${p.image_url}')">`).join('')}</div>` : ''}
      </div>
    </div>`;
  });

  html += '</div></div>';

  // 材料清单
  if (mats.length) {
    let total = 0;
    html += `<div class="card">
      <h3 style="font-size:15px;margin-bottom:12px;">🧵 材料清单</h3>`;
    mats.forEach(m => {
      const subtotal = (m.quantity || 0) * (m.unit_price || 0);
      total += subtotal;
      html += `<div class="material-card">
        <div class="mc-name">${m.name}</div>
        ${m.specification ? `<div class="mc-spec">${m.specification}</div>` : ''}
        <div class="mc-row">
          <span>${m.quantity}${m.unit} × ¥${m.unit_price} = ¥${subtotal.toFixed(2)}</span>
          <span style="color:${m.status === 'arrived' ? 'var(--c-success)' : 'var(--c-text-light)'};">
            ${matStatusText(m.status)}${m.arrival_date ? ' ' + fmtDay(m.arrival_date) : ''}
          </span>
        </div>
        ${m.merchant_image || m.actual_image ? `<div class="mc-images">
          ${m.merchant_image ? `<div class="mc-img-box" onclick="previewImg('${m.merchant_image}')"><img src="${m.merchant_image}"><div class="mc-label">商家图</div></div>` : ''}
          ${m.actual_image ? `<div class="mc-img-box" onclick="previewImg('${m.actual_image}')"><img src="${m.actual_image}"><div class="mc-label">实拍图</div></div>` : ''}
        </div>` : ''}
      </div>`;
    });
    html += `<div class="material-total">合计：¥${total.toFixed(2)}</div></div>`;
  }

  // 留言区
  html += `<div class="card" style="padding-bottom:0;">
    <h3 style="font-size:15px;margin-bottom:12px;">💬 留言</h3>
    <div class="chat-area" id="chatArea">`;

  msgs.forEach(m => {
    const isMine = currentUser && m.user_id === currentUser.id;
    const senderName = m.profiles?.is_admin ? '🏠 店长' : (m.profiles?.nickname || '用户');
    if (m.is_notification) {
      html += `<div class="chat-bubble notification"><div class="cb-body">📢 ${m.content}</div>
        <div class="cb-time">${fmtDate(m.created_at)}</div></div>`;
    } else {
      html += `<div class="chat-bubble ${isMine ? 'mine' : 'other'}">
        ${!isMine ? `<div class="cb-name">${senderName}</div>` : ''}
        <div class="cb-body">${m.content}${m.image_url ? `<br><img src="${m.image_url}" onclick="previewImg('${m.image_url}')">` : ''}</div>
        <div class="cb-time" style="${isMine ? 'text-align:right;' : ''}">${fmtDate(m.created_at)}</div>
      </div>`;
    }
  });

  html += `</div></div>`;

  // 留言输入
  if (currentUser) {
    html += `<div class="chat-input-bar" style="position:sticky;bottom:calc(var(--tab-height) + var(--safe-bottom));">
      <textarea id="msgInput" rows="1" placeholder="输入留言…"></textarea>
      <button class="chat-img-btn" onclick="sendMsgImage('${order.id}')">📷</button>
      <button class="btn btn-primary btn-sm" onclick="sendMessage('${order.id}')">发送</button>
    </div>`;
  }

  container.innerHTML = html;

  // 滚动到聊天区域底部
  setTimeout(() => {
    const chatArea = document.getElementById('chatArea');
    if (chatArea) chatArea.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }, 200);
}

/** 保存备注 */
async function saveRemark(orderId) {
  const newRemark = document.getElementById('remarkInput').value;

  // 获取旧备注
  const { data: old } = await sb.from('orders').select('remark').eq('id', orderId).single();
  const oldRemark = old?.remark || '';

  if (newRemark === oldRemark) {
    toast('备注未修改', 'info');
    return;
  }

  // 写入变更日志
  const { error: logErr } = await sb.from('remark_logs').insert({
    order_id: orderId,
    user_id: currentUser.id,
    old_remark: oldRemark,
    new_remark: newRemark
  });

  // 更新订单备注
  const { error } = await sb.from('orders')
    .update({ remark: newRemark })
    .eq('id', orderId);

  if (error) {
    toast('保存失败: ' + error.message, 'error');
    return;
  }
  toast('备注已更新', 'success');
}

/** 发送留言 */
async function sendMessage(orderId) {
  const input = document.getElementById('msgInput');
  const content = input.value.trim();
  if (!content) return;

  const { error } = await sb.from('messages').insert({
    order_id: orderId,
    user_id: currentUser.id,
    content
  });

  if (error) {
    toast('发送失败: ' + error.message, 'error');
    return;
  }
  input.value = '';
  loadOrderDetail(orderId);
}

/** 发送图片留言 */
function sendMsgImage(orderId) {
  const input = document.getElementById('fileInput');
  input.value = '';
  input.multiple = false;
  fileInputCallback = async (files) => {
    const url = await uploadImage('msg-images', files[0]);
    if (url) {
      const { error } = await sb.from('messages').insert({
        order_id: orderId,
        user_id: currentUser.id,
        content: '',
        image_url: url
      });
      if (error) toast('发送失败', 'error');
      else loadOrderDetail(orderId);
    }
  };
  input.click();
}

async function savePwd() {
  const pwd = document.getElementById('newPwd').value;
  const confirm = document.getElementById('confirmPwd').value;
  if (pwd.length < 6) return toast('密码至少6位', 'error');
  if (pwd !== confirm) return toast('两次密码不一致', 'error');

  const { error } = await sb.auth.updateUser({ password: pwd });
  if (error) return toast('修改失败: ' + error.message, 'error');
  toast('密码已更新', 'success');
  closeCommonModal();
}

let adminCurrentTab = 'dashboard';

function initAdmin(tab) {
  if (!currentProfile?.is_admin) {
    toast('无管理权限', 'error');
    navigateTo('profile');
    return;
  }
  adminCurrentTab = tab || 'dashboard';
  renderAdminNav();
  loadAdminTab();

function renderAdminNav() {
  const tabs = [
    { id: 'dashboard', label: '📊 面板' },
    { id: 'applications', label: '📝 申请' },
    { id: 'adminOrders', label: '📦 订单' },
    { id: 'adminQueue', label: '📋 排单' },
    { id: 'adminWorks', label: '🎨 作品' }
  ];
  document.getElementById('adminNav').innerHTML = tabs.map(t =>
    `<button class="admin-nav-item ${adminCurrentTab === t.id ? 'active' : ''}"
      onclick="switchAdminTab('${t.id}')">${t.label}</button>`
  ).join('');
}

function switchAdminTab(tab) {
  adminCurrentTab = tab;
  renderAdminNav();
  loadAdminTab();
  location.hash = 'admin/' + tab;
}

async function loadAdminTab() {
  const body = document.getElementById('adminBody');

  switch (adminCurrentTab) {
    case 'dashboard': return loadAdminDashboard(body);
    case 'applications': return loadAdminApps(body);
    case 'adminOrders': return loadAdminOrders(body);
    case 'adminQueue': return loadAdminQueue(body);
    case 'adminWorks': return loadAdminWorks(body);
  }
}
